<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyShortURL - Guaranteed Free & Unlimited URL Shortener</title>
    
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <!-- SEO and Social Sharing (Open Graph) -->
    <meta name="description" content="Tired of hitting limits with other URL shorteners?">
    
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://my-short-url-seven.vercel.app/">
    <meta property="og:title" content="MyShortURL - Guaranteed Free & Unlimited URL Shortener">
    <meta property="og:description" content="Tired of hitting limits with other URL shorteners?">
    
    <meta property="twitter:card" content="summary">
    <meta property="twitter:title" content="MyShortURL - Guaranteed Free & Unlimited URL Shortener">
    <meta property="twitter:description" content="Tired of hitting limits with other URL shorteners?">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <main class="container">
        <header>
            <div class="lang-toggle">
                <button id="lang-en" class="lang-btn active">EN</button>
                <button id="lang-th" class="lang-btn">TH</button>
            </div>
            <h1 class="logo">MyShortURL</h1>
            <p class="subtitle" data-i18n="header_subtitle">Shorten your links, expand your reach.</p>
        </header>

        <section class="shortener-card glass-panel">
            <form id="shorten-form">
                <div class="form-field">
                    <label for="url-input" class="input-label" data-i18n="label_url">Your URL</label>
                    <input type="text" id="url-input" class="text-input full-width" placeholder="https://longsolongveryverylong.com/longkongisfruit" required>
                </div>
                
                <div class="form-field gap-10">
                    <label for="custom-code-input" class="input-label" data-i18n="label_custom">Back-half (optional)</label>
                    <input type="text" id="custom-code-input" class="text-input half-width" placeholder="" pattern="[a-zA-Z0-9]*" title="Only English letters and numbers" data-i18n-title="title_custom_input">
                </div>

                <div class="form-actions">
                    <button type="submit" id="submit-btn" class="btn-primary" data-i18n="btn_shorten">Shorten</button>
                </div>
                
                <div id="validation-feedback" class="validation-feedback hidden">
                    <span id="validation-icon" class="validation-icon"></span>
                    <span id="validation-text" class="validation-text"></span>
                </div>
            </form>
            
            <div id="result-container" class="result-container hidden">
                <p class="result-label" data-i18n="label_result">Your shortened link:</p>
                <div class="result-box">
                    <a href="#" id="short-link" target="_blank"></a>
                    <button id="copy-btn" title="Copy to clipboard" data-i18n-title="title_copy">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                </div>
                <div id="copy-feedback" class="copy-feedback hidden" data-i18n="text_copied">Copied!</div>
                
                <div class="qr-container">
                    <p class="result-label" data-i18n="label_qr">QR Code:</p>
                    <img id="qr-code-img" alt="QR Code" />
                </div>
            </div>
        </section>

        <section class="recent-links glass-panel">
            <div class="recent-header">
                <h2 data-i18n="recent_title">Recent Links</h2>
                <div class="recent-actions">
                    <button id="clear-history-btn" class="icon-btn" title="Clear History" data-i18n-title="title_clear">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    </button>
                    <button id="toggle-recent-btn" class="icon-btn" title="Minimize/Expand" data-i18n-title="title_toggle">
                        <svg id="toggle-recent-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"></polyline></svg>
                    </button>
                </div>
            </div>
            <div id="recent-content">
                <ul id="recent-list" class="recent-list">
                    <!-- Recent links will be loaded here -->
                </ul>
            </div>
        </section>
    </main>

    <!-- QR Code Lightbox Modal -->
    <div id="qr-modal" class="modal-overlay hidden">
        <div class="qr-modal-content glass-panel">
            <button id="qr-close-btn" class="icon-btn qr-close" title="Close" data-i18n-title="title_close">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <h3 class="modal-title" data-i18n="modal_qr_title">Scan QR Code</h3>
            <img id="qr-code-large" alt="Large QR Code" crossorigin="anonymous" />
            <div class="qr-actions">
                <button id="qr-copy-btn" class="btn-secondary" data-i18n="btn_qr_copy">Copy Image</button>
                <button id="qr-download-btn" class="btn-primary" data-i18n="btn_qr_download">Download</button>
            </div>
        </div>
    </div>

    <!-- Custom Confirm Modal -->
    <div id="confirm-modal" class="modal-overlay hidden">
        <div class="modal-content glass-panel">
            <h3 class="modal-title" data-i18n="modal_confirm_title">Confirm Deletion</h3>
            <p id="modal-message" class="modal-message" data-i18n="modal_confirm_text">Are you sure you want to delete this?</p>
            <div class="modal-actions">
                <button id="modal-btn-yes" class="btn-danger" data-i18n="btn_yes">Yes</button>
                <button id="modal-btn-no" class="btn-secondary" data-i18n="btn_no">No</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
